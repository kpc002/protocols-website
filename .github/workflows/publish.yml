on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Fix timestamps
        run: bash .github/scripts/fix-timestamps

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: .

      - name: Verify rendered output is isolated
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          excluded = {".git", "_site", "_freeze", "node_modules"}
          collisions = []
          for html in Path(".").rglob("*.html"):
              if any(part in excluded for part in html.parts):
                  continue
              if any(html.with_suffix(suffix).exists() for suffix in (".md", ".qmd", ".ipynb")):
                  collisions.append(str(html))
          if collisions:
              print("Generated HTML appeared beside source files:")
              print("\n".join(collisions))
              sys.exit(1)
          PY
          
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: cf-pages
          publish_dir: _site
