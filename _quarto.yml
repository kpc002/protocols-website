project:
  type: website

website:
  title: "protocols.heeg.io"
  twitter-card: true
  page-navigation: true
  repo-url: https://github.com/maximilian-heeg/protocols.heeg.io
  repo-actions: [edit, issue]
  search:
    location: sidebar
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: protocols/
        text: Protocols
      - about.qmd
  sidebar:
    collapse-level: 1
    search: true
    style: "docked"
    contents: protocols/**
  page-footer:
    center: 
      - text: "About"
        href: about.qmd
  
format:
  html:
    theme:
      light: [flatly, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    code-line-numbers: false

editor: visual

execute:
  freeze: auto